<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="notgt:name" content="File animation — sponsor bug" />
		<title>Sponsor bug</title>
		<style>
			/*
			 * Пример анимации, написанной ФАЙЛОМ, а не в веб-редакторе.
			 *
			 * Рантайм notGT подключается автоматически, ДО этого скрипта, поэтому
			 * внутри доступны:
			 *   vars('sponsor.name', 'fallback')  — значение переменной
			 *   data                              — весь набор переменных
			 *   onData(fn)                        — вызывается при каждом изменении
			 *   root                              — контейнер анимации (document.body)
			 *   [data-bind="sponsor.name"]        — текст обновляется сам
			 *
			 * Значения задаются в панели «Control» или через POST /api/data.
			 * Файл перечитывается при показе анимации, поэтому после правки
			 * достаточно обновить Browser Source в OBS (или перезапустить
			 * анимацию), перезапуск NodeCG не нужен.
			 */

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}

			.bug {
				position: absolute;
				right: 4%;
				bottom: 9%;
				display: flex;
				align-items: stretch;
				font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
				/* Срез на правом краю — общий мотив встроенных примеров. */
				clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%);
				transform: translateX(120%);
				opacity: 0;
				transition:
					transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1),
					opacity 380ms ease-out;
			}

			.bug.is-visible {
				transform: translateX(0);
				opacity: 1;
			}

			.bug__label {
				display: flex;
				align-items: center;
				position: relative;
				z-index: 1;
				padding: 16px 44px 16px 24px;
				font-size: 24px;
				font-weight: 800;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: #ffffff;
				background: var(--accent, #ff3b30);
				clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
			}

			.bug__body {
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: 2px;
				margin-left: -22px;
				padding: 14px 52px 14px 44px;
				background: linear-gradient(180deg, rgba(24, 33, 45, 0.97), rgba(10, 14, 20, 0.97));
			}

			.bug__name {
				font-size: 40px;
				font-weight: 800;
				color: #ffffff;
				line-height: 1.05;
			}

			.bug__meta {
				font-size: 22px;
				font-weight: 500;
				color: #aab6c4;
				letter-spacing: 0.02em;
			}
		</style>
	</head>
	<body>
		<div class="bug" id="bug">
			<div class="bug__label" data-bind="sponsor.label">ПАРТНЁР</div>
			<div class="bug__body">
				<div class="bug__name" data-bind="sponsor.name">ACME</div>
				<div class="bug__meta" data-bind="sponsor.meta">Официальный партнёр</div>
			</div>
		</div>

		<script>
			// Рантайм уже подключён: onData вызывается сразу и при каждом изменении.
			function apply() {
				var bug = document.getElementById("bug");

				// Цвет акцента — из переменной, с запасным значением.
				bug.style.setProperty("--accent", vars("sponsor.accent", "#ff3b30"));

				// Показываем, если партнёр задан; иначе прячем.
				var hasSponsor = vars("sponsor.name", "") !== "";
				bug.classList.toggle("is-visible", hasSponsor);
			}

			onData(apply);

			// Появление и уход код-анимация анимирует сама — систему её обёртка
			// больше не касается. Здесь это тот же CSS-переход по `.is-visible`.
			onShow(apply);
			onHide(function () {
				document.getElementById("bug").classList.remove("is-visible");
			}, 400);
		</script>
	</body>
</html>
