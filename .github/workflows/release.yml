# The only CI this fork runs: it builds the portable packages — Windows and
# macOS — and, for a version tag, attaches them to a GitHub Release.
#
#   push to main  -> build the packages (do they still build?) and upload the artifacts
#   push v* tag   -> build them and publish the Release
#   manual run    -> same as a push; fill in `tag` to publish as well
#
# The upstream NodeCG checks (lint/types/tests/container) are kept in ci.yaml but
# are manual-only here, so a red badge never comes from code that notGT does not use.
#
# The heavy lifting lives in scripts/build-windows.mjs and scripts/build-macos.mjs,
# so that the exact same packaging can be reproduced locally with:
#   node scripts/build-windows.mjs --node-version 22.14.0
#   node scripts/build-macos.mjs --node-version 22.14.0      (on a Mac)
name: Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to publish (manual runs only, e.g. v1.2.3). Leave empty to only build the artifact."
        required: false
        type: string

# contents: write is required to create/update the GitHub Release.
permissions:
  contents: write

jobs:
  windows-package:
    name: Build notGT-win-x64
    runs-on: windows-latest

    env:
      # The root devDependencies include puppeteer, but this job never launches
      # a browser; skip the Chromium download entirely.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          # Both lockfiles are used: the monorepo root and the notGT bundle.
          cache-dependency-path: |
            package-lock.json
            bundles/notGT/package-lock.json

      # Build the NodeCG monorepo exactly like local development does.
      - name: Install monorepo dependencies
        run: npm ci

      - name: Build NodeCG workspaces
        run: npm run build

      # The notGT bundle is not an npm workspace: it has its own lockfile and
      # its own esbuild/Vite build, run from inside the bundle directory.
      - name: Install bundle dependencies
        working-directory: bundles/notGT
        run: npm ci

      - name: Build the notGT bundle
        working-directory: bundles/notGT
        run: npm run build

      # Assembles app/, downloads the official Windows Node runtime (SHA-256
      # checked against nodejs.org), compiles the launcher when mingw-w64 is
      # available and writes dist/notGT-win-x64.zip. windows-latest usually has
      # no mingw-w64, in which case the native .exe is skipped and notGT.cmd is
      # the entry point — that fallback is fully functional on its own.
      # The native launcher is the point of this package, so make sure a
      # compiler is actually present instead of silently shipping only the
      # .cmd fallback. The Windows runner image usually carries MinGW-w64 in
      # C:\mingw64; Chocolatey covers the case where it does not.
      - name: Ensure a Windows C compiler for the launcher
        shell: pwsh
        run: |
          $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            foreach ($dir in @("C:\mingw64\bin", "C:\ProgramData\mingw64\mingw64\bin", "C:\tools\mingw64\bin")) {
              if (Test-Path (Join-Path $dir "x86_64-w64-mingw32-gcc.exe")) {
                Write-Host "Found MinGW in $dir"
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                $gcc = $true
                break
              }
            }
          }
          if (-not $gcc) {
            Write-Host "MinGW not found, installing via Chocolatey"
            choco install mingw -y --no-progress
          }
          & x86_64-w64-mingw32-gcc --version | Select-Object -First 1

      - name: Build the Windows package
        # --smoke starts the packaged server with the packaged node.exe and
        # checks the dashboard, the out page, the API and the database, so a
        # package that cannot start on Windows fails here instead of shipping.
        run: node scripts/build-windows.mjs --node-version 22.14.0 --smoke

      # Fail loudly rather than publishing a build without the launcher.
      - name: Assert the launcher executable exists
        shell: pwsh
        run: |
          $exe = "dist/notGT-win-x64/notGT Launcher.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe - the native launcher was not built" }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notGT-win-x64
          path: dist/notGT-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos-package:
    name: Build notGT-macos-arm64
    # Apple silicon. The database driver in the package is the one of the
    # machine that builds it, so the runner's architecture is the package's.
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that the runner is Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bundles/notGT/package-lock.json

      - name: Install monorepo dependencies
        run: npm ci

      - name: Build NodeCG workspaces
        run: npm run build

      - name: Install bundle dependencies
        working-directory: bundles/notGT
        run: npm ci

      - name: Build the notGT bundle
        working-directory: bundles/notGT
        run: npm run build

      # Assembles the same app/ as the Windows package, downloads the official
      # macOS Node runtime (SHA-256 checked against nodejs.org), compiles the
      # launcher's window with the system clang and writes
      # dist/notGT-macos-arm64.zip. --smoke starts the packaged server with the
      # packaged Node, and then the launcher's window itself, which has to show
      # the launcher's page — so a package that cannot start on a Mac fails
      # here instead of shipping.
      - name: Build the macOS package
        run: node scripts/build-macos.mjs --node-version 22.14.0 --arch arm64 --skip-build --smoke

      - name: Assert the launcher application exists
        run: |
          APP="dist/notGT-macos-arm64/notGT Launcher.app"
          test -x "$APP/Contents/MacOS/notGT-launcher"
          lipo -archs "$APP/Contents/MacOS/notGT-launcher"
          codesign --verify --verbose "$APP"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notGT-macos-arm64
          path: dist/notGT-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      # What the window looked like on the runner, to look at after a build.
      - name: Upload a picture of the launcher's window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launcher-preview
          path: dist/macos-launcher.png
          if-no-files-found: ignore
          retention-days: 30

  # Publishes both packages as one GitHub Release. It waits for both builds: a
  # release never goes out with one of its packages missing.
  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    needs: [windows-package, macos-package]
    runs-on: ubuntu-latest

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: notGT-*
          merge-multiple: true

      # Idempotent: a re-run of the same tag uploads with --clobber instead of
      # failing. `gh` is preinstalled on GitHub-hosted runners.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l packages

          cat > release-body.md <<'EOF'
          Портативные сборки: Node.js устанавливать не нужно — он уже внутри.

          - **Windows (x64)** — `notGT-win-x64.zip`
          - **macOS (Apple silicon, M1 и новее)** — `notGT-macos-arm64.zip`

          ## notGT для Windows (x64)

          Портативная сборка: распакуйте ZIP-архив целиком в отдельную папку и
          запустите `notGT Launcher.exe` (или `notGT.cmd`, если `.exe` не собран).
          Node.js устанавливать не нужно — он уже внутри.

          ### Что внутри

          - `notGT Launcher.exe` — лаунчер: окно с выбором интерфейса и порта, запуском и остановкой сервера, входом по паролю, брандмауэром и журналом; язык — RU / EN;
          - `notGT.cmd` — запасной запуск через `node\node.exe`: то же управление страницей в браузере;
          - `launcher/` — то, чем управляет окно лаунчера;
          - `node/` — официальный Node.js для Windows;
          - `app/` — сервер NodeCG и собранный бандл `notGT` (`app/bundles/notGT`), а также `cfg/`, `db/`, `assets/`, `logs/`.

          ### Запуск

          1. Распакуйте архив в отдельную папку.
          2. Запустите `notGT Launcher.exe`.
          3. Выберите сетевой интерфейс и порт, нажмите «Запустить», затем «Открыть панель».
          4. Панель спросит имя и пароль. На новом сервере это `admin` / `admin` — войдите и сразу смените пароль во вкладке «Команда». Там же добавляются остальные пользователи, их группы и ключи для Bitfocus Companion.

          Закрытие лаунчера сервер не останавливает: он продолжает работать, и при
          следующем запуске лаунчер покажет, что сервер запущен. Остановить сервер —
          кнопка «Остановить».

          ### Если дашборд не открывается на другом устройстве

          Сервер слушает все интерфейсы, а выбранный адрес подставляется в ссылки.
          Если страница «грузится бесконечно», почти всегда виноват брандмауэр
          Windows: он не пускает входящие подключения к `node.exe`. В лаунчере
          откройте «Сеть и брандмауэр…» и нажмите «Разрешить порт» (нужны права
          администратора) — правило создаётся для выбранного порта во всех профилях
          сети. Кнопка «Проверить» показывает, какие адреса реально отвечают.

          ### OBS Browser Source

          Адрес копируется в панели кнопкой «Ссылка для OBS» — у каждого выхода (out)
          он свой и содержит ключ этого выхода:

          ```
          http://<выбранный-интерфейс>:<порт>/bundles/notGT/graphics/out.html?out=main&key=out_…
          ```

          Размер 1920x1080, включите «Прозрачный фон». При обновлении с версии без
          входа по паролю скопируйте ссылки в OBS заново: старые, без ключа, покажут
          страницу входа.

          ### Данные

          Настройки и медиа лежат в `app\cfg`, `app\db` и `app\assets`. При
          обновлении распакуйте новую версию в новую папку и перенесите эти
          каталоги — загруженные файлы и база сохранятся.

          ## notGT для macOS (Apple silicon)

          Для Mac на процессорах Apple (M1 и новее), macOS 11 и новее. Распакуйте
          ZIP-архив целиком и запустите `notGT Launcher` из распакованной папки. Не
          вынимайте программу из папки: рядом с ней лежат `node`, `launcher` и `app`.

          ### Первый запуск

          Сборка не подписана сертификатом разработчика Apple, поэтому при первом
          запуске macOS скажет, что не может её проверить. Любой из двух способов:

          - «Системные настройки» → «Конфиденциальность и безопасность» → внизу
            «Всё равно открыть» (появляется после первой попытки запуска);
          - или в Терминале, указав свою папку:

            ```
            xattr -dr com.apple.quarantine ~/Downloads/notGT-macos-arm64
            ```

          После разрешения программа сама снимает отметку карантина со своей папки:
          иначе macOS не даст серверу загрузить драйвер базы данных.

          ### Что внутри

          - `notGT Launcher.app` — лаунчер: окно с выбором интерфейса и порта, запуском и остановкой сервера, входом по паролю и журналом; язык — RU / EN;
          - `notGT.command` — запасной запуск без окна: то же управление страницей в браузере;
          - `launcher/`, `node/`, `app/` — то же, что в сборке для Windows.

          Закрытие окна сервер не останавливает; остановить его — кнопка
          «Остановить». Данные лежат в `app/cfg`, `app/db` и `app/assets`.
          EOF

          # Substitute the tag at the top of the generated notes.
          BODY="$(printf '# notGT %s\n\n' "$TAG"; cat release-body.md)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/updating the assets."
            gh release upload "$TAG" packages/notGT-win-x64.zip packages/notGT-macos-arm64.zip --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" packages/notGT-win-x64.zip packages/notGT-macos-arm64.zip \
              --title "notGT $TAG" \
              --notes "$BODY"
          fi
