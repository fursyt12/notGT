# The only CI this fork runs: it builds the portable packages — Windows and
# macOS — and, for a version tag, attaches them to a GitHub Release.
#
#   push to main  -> build the packages (do they still build?) and upload the artifacts
#   push v* tag   -> build them and publish the Release
#   manual run    -> same as a push; fill in `tag` to publish as well
#
# The upstream NodeCG checks (lint/types/tests/container) are kept in ci.yaml but
# are manual-only here, so a red badge never comes from code that notGT does not use.
#
# The heavy lifting lives in scripts/build-windows.mjs and scripts/build-macos.mjs,
# so that the exact same packaging can be reproduced locally with:
#   node scripts/build-windows.mjs --node-version 22.14.0
#   node scripts/build-macos.mjs --node-version 22.14.0      (on a Mac)
name: Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to publish (manual runs only, e.g. v1.2.3). Leave empty to only build the artifact."
        required: false
        type: string

# contents: write is required to create/update the GitHub Release.
permissions:
  contents: write

jobs:
  windows-package:
    name: Build notGT-win-x64
    runs-on: windows-latest

    env:
      # The root devDependencies include puppeteer, but this job never launches
      # a browser; skip the Chromium download entirely.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          # Both lockfiles are used: the monorepo root and the notGT bundle.
          cache-dependency-path: |
            package-lock.json
            bundles/notGT/package-lock.json

      # The NDI sender's native converter (ndi/native, Rust + Vulkan): built
      # here and shipped in the package; the sender's default converter stays
      # WebGL2, the native one is chosen with NOTGT_NDI_CONVERTER=native.
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ndi/native/target
            spout/native/target
          key: cargo-windows-${{ hashFiles('ndi/native/**/Cargo.toml', 'ndi/native/Cargo.lock', 'spout/native/**/Cargo.toml', 'spout/native/Cargo.lock') }}

      # Its arithmetic, layouts and frame rates; the Vulkan tests need a GPU.
      - name: Test the native NDI converter (no GPU)
        working-directory: ndi/native
        run: cargo test --release -p notgt-ndi-core

      - name: Build the native NDI converter
        working-directory: ndi
        run: node scripts/build-native.mjs

      # The Spout library's addon (spout/native, Rust + D3D11), which the
      # sender loads for the outs shared over Spout. Its tests open what they
      # share as a receiver would; WARP stands in for the GPU.
      - name: Test the Spout sender
        working-directory: spout/native
        run: cargo test --release -p notgt-spout-core

      - name: Build the Spout addon
        working-directory: spout
        run: node scripts/build-native.mjs

      # Build the NodeCG monorepo exactly like local development does.
      - name: Install monorepo dependencies
        run: npm ci

      - name: Build NodeCG workspaces
        run: npm run build

      # The notGT bundle is not an npm workspace: it has its own lockfile and
      # its own esbuild/Vite build, run from inside the bundle directory.
      - name: Install bundle dependencies
        working-directory: bundles/notGT
        run: npm ci

      - name: Build the notGT bundle
        working-directory: bundles/notGT
        run: npm run build

      # Assembles app/, downloads the official Windows Node runtime (SHA-256
      # checked against nodejs.org), compiles the launcher when mingw-w64 is
      # available and writes dist/notGT-win-x64.zip. windows-latest usually has
      # no mingw-w64, in which case the native .exe is skipped and notGT.cmd is
      # the entry point — that fallback is fully functional on its own.
      # The native launcher is the point of this package, so make sure a
      # compiler is actually present instead of silently shipping only the
      # .cmd fallback. The Windows runner image usually carries MinGW-w64 in
      # C:\mingw64; Chocolatey covers the case where it does not.
      - name: Ensure a Windows C compiler for the launcher
        shell: pwsh
        run: |
          $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            foreach ($dir in @("C:\mingw64\bin", "C:\ProgramData\mingw64\mingw64\bin", "C:\tools\mingw64\bin")) {
              if (Test-Path (Join-Path $dir "x86_64-w64-mingw32-gcc.exe")) {
                Write-Host "Found MinGW in $dir"
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                $gcc = $true
                break
              }
            }
          }
          if (-not $gcc) {
            Write-Host "MinGW not found, installing via Chocolatey"
            choco install mingw -y --no-progress
          }
          & x86_64-w64-mingw32-gcc --version | Select-Object -First 1

      - name: Build the Windows package
        # --smoke starts the packaged server with the packaged node.exe and
        # checks the dashboard, the out page, the API and the database, so a
        # package that cannot start on Windows fails here instead of shipping.
        run: node scripts/build-windows.mjs --node-version 22.14.0 --smoke --native-ndi

      # The converter's addon has to load in the package's own Node, and its
      # probe has to run (the runner has no GPU: it says so).
      - name: Check the native NDI converter loads
        shell: pwsh
        working-directory: dist/notGT-win-x64/ndi
        run: |
          ..\node\node.exe -e "import('./src/native.mjs').then(m => { const n = m.loadNative(); if (!n.module) { console.error(n.why); process.exit(1) } for (const l of m.describeProbe(n.module.probe())) console.log(l) })"

      - name: Check the Spout addon loads
        shell: pwsh
        working-directory: dist/notGT-win-x64/spout
        run: |
          ..\node\node.exe -e "import('./index.mjs').then(m => { const s = m.loadSpout(); if (!s.module) { console.error(s.why); process.exit(1) } console.log('Spout addon: ' + s.file) })"

      # Fail loudly rather than publishing a build without the launcher.
      - name: Assert the launcher executable exists
        shell: pwsh
        run: |
          $exe = "dist/notGT-win-x64/notGT Launcher.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe - the native launcher was not built" }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notGT-win-x64
          path: dist/notGT-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos-package:
    name: Build notGT-macos-arm64
    # Apple silicon. The database driver in the package is the one of the
    # machine that builds it, so the runner's architecture is the package's.
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that the runner is Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bundles/notGT/package-lock.json

      - name: Install monorepo dependencies
        run: npm ci

      - name: Build NodeCG workspaces
        run: npm run build

      - name: Install bundle dependencies
        working-directory: bundles/notGT
        run: npm ci

      - name: Build the notGT bundle
        working-directory: bundles/notGT
        run: npm run build

      # Assembles the same app/ as the Windows package, downloads the official
      # macOS Node runtime (SHA-256 checked against nodejs.org), compiles the
      # launcher's window with the system clang and writes
      # dist/notGT-macos-arm64.zip. --smoke starts the packaged server with the
      # packaged Node, and then the launcher's window itself, which has to show
      # the launcher's page — so a package that cannot start on a Mac fails
      # here instead of shipping.
      - name: Build the macOS package
        run: node scripts/build-macos.mjs --node-version 22.14.0 --arch arm64 --skip-build --smoke

      - name: Assert the launcher application exists
        run: |
          APP="dist/notGT-macos-arm64/notGT Launcher.app"
          test -x "$APP/Contents/MacOS/notGT-launcher"
          lipo -archs "$APP/Contents/MacOS/notGT-launcher"
          codesign --verify --verbose "$APP"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notGT-macos-arm64
          path: dist/notGT-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      # What the window looked like on the runner, to look at after a build.
      - name: Upload a picture of the launcher's window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launcher-preview
          path: dist/macos-launcher.png
          if-no-files-found: ignore
          retention-days: 30

  # Publishes the packages as one GitHub Release. It goes out once the Windows
  # package is built, whatever became of the macOS one: GitHub's macOS arm64
  # runners are sometimes not to be had for hours ("not acquired ... even after
  # multiple attempts"), and the release should not wait for them. A macOS
  # build that gets through later — "Re-run failed jobs", which runs this job
  # again, or the tag pushed again — adds its zip to the same release.
  release:
    name: Publish the GitHub Release
    if: >-
      always() &&
      needs.windows-package.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '')
    needs: [windows-package, macos-package]
    runs-on: ubuntu-latest

    steps:
      # Only for the release notes (docs/release-notes), at the tag being published.
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: docs/release-notes

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: notGT-*
          merge-multiple: true

      # Idempotent: a re-run of the same tag uploads with --clobber instead of
      # failing. `gh` is preinstalled on GitHub-hosted runners.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l packages

          # The notes live in docs/release-notes: English first, then Russian,
          # with links to both at the top. `<tag>.en.md` / `<tag>.ru.md` say what
          # is new (optional); install.*.md is the guide every release has. A
          # release page gives its headings no anchors, so each section has one
          # of its own (GitHub keeps it as `user-content-<id>`, which is what the
          # links point at).
          NOTES=docs/release-notes
          {
            printf '# notGT %s\n\n' "$TAG"
            printf '**[English](#user-content-english) · [Русский](#user-content-russian)**\n\n'
            printf '<a id="english"></a>\n\n## English\n\n'
            if [ -f "$NOTES/$TAG.en.md" ]; then cat "$NOTES/$TAG.en.md"; printf '\n'; fi
            cat "$NOTES/install.en.md"
            printf '\n---\n\n<a id="russian"></a>\n\n## Русский\n\n'
            if [ -f "$NOTES/$TAG.ru.md" ]; then cat "$NOTES/$TAG.ru.md"; printf '\n'; fi
            cat "$NOTES/install.ru.md"
          } > release-body.md

          # A beta: docs/release-notes/<tag>.prerelease exists. It goes out as a
          # pre-release, never as the latest release.
          TITLE="notGT $TAG"
          KIND=()
          if [ -f "$NOTES/$TAG.prerelease" ]; then
            TITLE="notGT $TAG (beta)"
            KIND=(--prerelease --latest=false)
          fi

          # What was built: Windows always (this job needs it), macOS when its
          # build got through.
          ASSETS=(packages/notGT-win-x64.zip)
          if [ -f packages/notGT-macos-arm64.zip ]; then
            ASSETS+=(packages/notGT-macos-arm64.zip)
          else
            echo "::warning::The macOS package was not built (${{ needs.macos-package.result }}): the release goes out with Windows only. Re-run the failed jobs to add it."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating the notes and the assets."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-body.md "${KIND[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file release-body.md "${KIND[@]}"
          fi
