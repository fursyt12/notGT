<!doctype html>
<html lang="ru">
	<head>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3C/svg%3E"
		/>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>notGT — лончер</title>
		<style>
			:root {
				--bg: #14161a;
				--panel: #1c1f26;
				--panel-2: #232733;
				--border: #2e3340;
				--text: #e7e9ee;
				--muted: #8b93a7;
				--accent: #3d7eff;
				--accent-hover: #5a93ff;
				--green: #2ecc71;
				--red: #e74c3c;
				--amber: #f1c40f;
				--blue: #3498db;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				background: var(--bg);
				color: var(--text);
				font:
					13px/1.45 "Segoe UI",
					Tahoma,
					Verdana,
					sans-serif;
			}
			.wrap {
				max-width: 720px;
				margin: 0 auto;
				padding: 16px 18px 28px;
			}
			header {
				display: flex;
				align-items: baseline;
				gap: 10px;
				margin-bottom: 2px;
			}
			h1 {
				font-size: 24px;
				margin: 0;
				letter-spacing: 0.4px;
			}
			h1 span {
				color: var(--accent);
			}
			.sub {
				color: var(--muted);
				font-size: 11px;
				margin-bottom: 14px;
			}
			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 14px;
				margin-bottom: 12px;
			}
			.row {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.field.iface {
				flex: 1 1 340px;
			}
			.field.port {
				flex: 0 0 130px;
			}
			label {
				color: var(--muted);
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}
			select,
			input[type="number"],
			input[type="text"] {
				background: var(--panel-2);
				color: var(--text);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 8px 9px;
				font: inherit;
				outline: none;
				width: 100%;
			}
			select:focus,
			input:focus {
				border-color: var(--accent);
			}
			.buttons {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				margin-top: 14px;
			}
			button {
				background: var(--panel-2);
				color: var(--text);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 8px 16px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
				transition:
					background 0.12s,
					border-color 0.12s,
					opacity 0.12s;
			}
			button:hover:not(:disabled) {
				border-color: var(--accent);
				background: #2a2f3d;
			}
			button.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			button.primary:hover:not(:disabled) {
				background: var(--accent-hover);
				border-color: var(--accent-hover);
			}
			button:disabled {
				opacity: 0.38;
				cursor: not-allowed;
			}
			.status-head {
				display: flex;
				align-items: center;
				gap: 10px;
				flex-wrap: wrap;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				padding: 5px 12px;
				border-radius: 999px;
				font-weight: 700;
				font-size: 12px;
				border: 1px solid transparent;
				white-space: nowrap;
			}
			.pill::before {
				content: "";
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: currentColor;
			}
			.pill.stopped {
				color: #aab2c4;
				background: #262b36;
				border-color: #39404f;
			}
			.pill.starting {
				color: var(--amber);
				background: rgba(241, 196, 15, 0.12);
				border-color: rgba(241, 196, 15, 0.4);
			}
			.pill.running {
				color: var(--green);
				background: rgba(46, 204, 113, 0.12);
				border-color: rgba(46, 204, 113, 0.4);
			}
			.pill.stopping {
				color: var(--blue);
				background: rgba(52, 152, 219, 0.12);
				border-color: rgba(52, 152, 219, 0.4);
			}
			.pill.error {
				color: var(--red);
				background: rgba(231, 76, 60, 0.12);
				border-color: rgba(231, 76, 60, 0.4);
			}
			.status-text {
				color: var(--muted);
				font-size: 12px;
				margin-top: 8px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.url-row {
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.url-row input {
				flex: 1;
				font-family: Consolas, "Courier New", monospace;
			}
			.note {
				color: var(--muted);
				font-size: 11px;
				margin-top: 8px;
			}
			details {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 8px;
				overflow: hidden;
			}
			summary {
				cursor: pointer;
				padding: 10px 14px;
				font-weight: 600;
				color: var(--text);
				user-select: none;
			}
			summary:hover {
				background: var(--panel-2);
			}
			pre#log {
				margin: 0;
				padding: 10px 14px;
				height: 240px;
				overflow: auto;
				background: #0f1116;
				border-top: 1px solid var(--border);
				font-family: Consolas, "Courier New", monospace;
				font-size: 11.5px;
				line-height: 1.4;
				white-space: pre-wrap;
				word-break: break-word;
				color: #c8cfdd;
			}
			.toast {
				position: fixed;
				right: 16px;
				bottom: 16px;
				background: var(--green);
				color: #06210f;
				font-weight: 700;
				padding: 8px 14px;
				border-radius: 6px;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.2s;
			}
			.toast.show {
				opacity: 1;
			}
			code {
				color: #9fb4da;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<h1>not<span>GT</span></h1>
			</header>
			<div class="sub" id="about">лончер</div>

			<div class="card">
				<div class="status-head">
					<span class="pill stopped" id="pill">остановлено</span>
					<span id="pillHint" class="note" style="margin: 0"></span>
				</div>
				<div class="status-text" id="statusText">Сервер не запущен.</div>
			</div>

			<div class="card">
				<div class="row">
					<div class="field iface">
						<label for="iface">Интерфейс</label>
						<select id="iface"></select>
					</div>
					<div class="field port">
						<label for="port">Порт</label>
						<input
							id="port"
							type="number"
							min="1024"
							max="65535"
							step="1"
							value="9090"
						/>
					</div>
				</div>
				<div class="buttons">
					<button class="primary" id="btnStart">Запустить</button>
					<button id="btnStop">Остановить</button>
					<button id="btnOpen">Открыть GUI</button>
				</div>
			</div>

			<div class="card">
				<label for="guiUrl">Адрес GUI</label>
				<div class="url-row" style="margin-top: 5px">
					<input id="guiUrl" type="text" readonly value="" />
					<button id="btnCopy">Копировать</button>
				</div>
				<div class="note">
					Панель управления для оператора — откройте этот адрес в браузере
					(кнопка «Открыть GUI»). В OBS добавляется <b>другая</b> ссылка:
					источник «Браузер» с адресом <code id="obsUrl"></code>
				</div>
			</div>

			<details id="logPanel">
				<summary>Журнал сервера (<span id="logCount">0</span>)</summary>
				<pre id="log"></pre>
			</details>
		</div>

		<div class="toast" id="toast">Скопировано</div>

		<script>
			// ------------------------------------------------------------------
			// Tiny local launcher client. No external requests, no dependencies.
			// ------------------------------------------------------------------
			var state = null;
			var logLines = [];
			var logSince = 0;
			var interfacesKey = "";
			var userTouched = false;

			var STATUS_LABEL = {
				stopped: "остановлено",
				starting: "запуск…",
				running: "работает",
				stopping: "остановка…",
				error: "ошибка",
			};

			function $(id) {
				return document.getElementById(id);
			}

			function api(pathname, options) {
				return fetch(pathname, options).then(function (res) {
					return res
						.json()
						.catch(function () {
							return {};
						})
						.then(function (body) {
							return { status: res.status, body: body };
						});
				});
			}

			function openHostFor(host) {
				return host === "0.0.0.0" || host === "::" ? "127.0.0.1" : host;
			}

			function originFor(host, port) {
				var h = openHostFor(host);
				if (h.indexOf(":") >= 0 && h.charAt(0) !== "[") h = "[" + h + "]";
				return "http://" + h + ":" + port;
			}

			function previewUrl(host, port) {
				return originFor(host, port) + "/dashboard/";
			}

			/** The URL that goes into an OBS Browser Source. */
			function obsUrlFor(host, port) {
				return (
					originFor(host, port) + "/bundles/notGT/graphics/out.html?out=main"
				);
			}

			function currentSelection() {
				var host = $("iface").value || "0.0.0.0";
				var port = parseInt($("port").value, 10);
				if (!isFinite(port)) port = 9090;
				return { host: host, port: port };
			}

			function buildInterfaces(interfaces, selected) {
				var sel = $("iface");
				sel.innerHTML = "";
				var groups = {
					all: document.createElement("optgroup"),
					local: document.createElement("optgroup"),
					net: document.createElement("optgroup"),
				};
				groups.all.label = "Все интерфейсы";
				groups.local.label = "Только этот компьютер";
				groups.net.label = "Сетевые адреса";

				interfaces.forEach(function (item) {
					var opt = document.createElement("option");
					opt.value = item.id;
					opt.textContent = item.label;
					if (item.address === "0.0.0.0") groups.all.appendChild(opt);
					else if (item.address === "127.0.0.1" || item.address === "::1")
						groups.local.appendChild(opt);
					else groups.net.appendChild(opt);
				});

				["all", "local", "net"].forEach(function (key) {
					if (groups[key].childElementCount > 0) sel.appendChild(groups[key]);
				});

				if (selected) {
					var found = Array.prototype.some.call(sel.options, function (o) {
						return o.value === selected;
					});
					sel.value = found
						? selected
						: interfaces.length
							? interfaces[0].id
							: "0.0.0.0";
				}
			}

			function setPill(status) {
				var pill = $("pill");
				pill.className = "pill " + status;
				pill.textContent = STATUS_LABEL[status] || status;
			}

			function render() {
				if (!state) return;

				$("about").textContent =
					"лончер v" +
					state.version +
					" · Node " +
					state.nodeVersion +
					" · " +
					state.platform;

				setPill(state.status);
				$("statusText").textContent = state.statusText || "";

				var ifacesKey = JSON.stringify(
					state.interfaces.map(function (i) {
						return [i.id, i.label];
					}),
				);
				if (ifacesKey !== interfacesKey) {
					interfacesKey = ifacesKey;
					buildInterfaces(state.interfaces, state.host);
				} else {
					var hasHost = Array.prototype.some.call(
						$("iface").options,
						function (o) {
							return o.value === state.host;
						},
					);
					if (hasHost && !userTouched) $("iface").value = state.host;
				}

				// Keep the port input in sync with the server until the user edits it.
				if (!userTouched && document.activeElement !== $("port")) {
					$("port").value = state.port;
				}

				var busy = state.status === "starting" || state.status === "stopping";
				$("btnStart").disabled = busy || state.status === "running";
				$("btnStop").disabled =
					state.status === "stopped" || state.status === "error";
				$("btnOpen").disabled = state.status !== "running";

				// When running, show the real address reported by the launcher.
				// Otherwise preview the current selection.
				var sel = currentSelection();
				$("guiUrl").value =
					state.status === "running"
						? state.guiUrl
						: previewUrl(sel.host, sel.port);
				var obs = $("obsUrl");
				if (obs) obs.textContent = obsUrlFor(sel.host, sel.port);
			}

			function refresh() {
				api("/api/state")
					.then(function (r) {
						if (r.body && r.body.status) {
							state = r.body;
							render();
						}
					})
					.catch(function () {
						/* launcher not reachable yet */
					});
			}

			function pollLogs() {
				api("/api/logs?since=" + logSince)
					.then(function (r) {
						var body = r.body || {};
						if (Array.isArray(body.lines) && body.lines.length) {
							logLines = logLines.concat(body.lines);
							if (logLines.length > 400) logLines = logLines.slice(-400);
							logSince = typeof body.next === "number" ? body.next : logSince;
							var pre = $("log");
							var atBottom =
								pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
							pre.textContent = logLines.join("\n");
							if (atBottom) pre.scrollTop = pre.scrollHeight;
							$("logCount").textContent = String(logSince);
						}
					})
					.catch(function () {
						/* ignore */
					});
			}

			function post(pathname, payload) {
				return api(pathname, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify(payload || {}),
				});
			}

			function start() {
				var sel = currentSelection();
				if (sel.port < 1024 || sel.port > 65535) {
					$("statusText").textContent =
						"Порт должен быть в диапазоне 1024–65535.";
					return;
				}
				$("btnStart").disabled = true;
				post("/api/start", sel).then(function (r) {
					if (r.body && r.body.status) {
						state = r.body;
						userTouched = false;
						render();
					}
					refresh();
				});
			}

			function stop() {
				$("btnStop").disabled = true;
				post("/api/stop").then(function (r) {
					if (r.body && r.body.status) state = r.body;
					refresh();
				});
			}

			function openGui() {
				post("/api/open", {}).then(function () {
					/* nothing to report */
				});
			}

			function copyUrl() {
				var input = $("guiUrl");
				var value = input.value;
				var done = function () {
					var toast = $("toast");
					toast.classList.add("show");
					setTimeout(function () {
						toast.classList.remove("show");
					}, 1200);
				};
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(value).then(done, function () {
						fallbackCopy(input, done);
					});
				} else {
					fallbackCopy(input, done);
				}
			}

			function fallbackCopy(input, done) {
				try {
					input.removeAttribute("readonly");
					input.select();
					input.setSelectionRange(0, input.value.length);
					document.execCommand("copy");
					input.setAttribute("readonly", "readonly");
					done();
				} catch (e) {
					/* ignore */
				}
			}

			$("btnStart").addEventListener("click", start);
			$("btnStop").addEventListener("click", stop);
			$("btnOpen").addEventListener("click", openGui);
			$("btnCopy").addEventListener("click", copyUrl);
			$("iface").addEventListener("change", function () {
				userTouched = true;
				render();
			});
			$("port").addEventListener("input", function () {
				userTouched = true;
			});

			refresh();
			pollLogs();
			setInterval(refresh, 1000);
			setInterval(pollLogs, 1000);
		</script>
	</body>
</html>
