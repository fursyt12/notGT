<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>notGT NDI benchmark</title>
		<!--
			What scripts/bench.mjs sends and checks. #still, #lower or #full:
			- known colour patches, top left, never covered: checked against
			  what the receiver gets (straight alpha);
			- a time stamp below them, as 32 black or white blocks: 24 bits of
			  Date.now() and an 8-bit check sum, read back for the latency;
			- a count under it, the same way: the show (0 for none), its frame,
			  the page's own frame (one more each animation frame it draws, to
			  256 and round again) and a check sum — a frame missing from it
			  is one lost after the page drew it;
			- #lower: a lower third sliding in and out, as titles do;
			- #full: also the whole picture under it moving;
			- #heavy: #full and five code titles on top, each in a sandboxed
			  iframe as notGT's code titles are, each a different load —
			  kinetic text, a canvas of particles, animated SVG with a blur,
			  CSS clip-paths, masks and a backdrop blur, a scoreboard rewritten
			  every frame. None covers the patches or the stamp;
			- #entry: shows, as notGT starts them, on a page that is still
			  between them. Every `period` ms (?period=, 2500 unless given) a
			  timer starts one — as a message from the server would — of 60
			  frames at the out's rate (?fps=, 60 unless given): the lower
			  third slides in, the count says which frame of the show each
			  animation frame is (as a code title's script draws), and a
			  white marker steps along a track below it one place a frame,
			  moved by the Web Animations API on the compositor (as a layers
			  title moves). Both should reach the receiver from their frame 0,
			  every frame of them; scripts/bench.mjs --page entry checks that.
			#still draws once and never again.
		-->
		<style>
			html,
			body {
				margin: 0;
				width: 1920px;
				height: 1080px;
				background: transparent;
				overflow: hidden;
				font-family: "DejaVu Sans", sans-serif;
			}
			.patch {
				position: absolute;
				top: 40px;
				width: 64px;
				height: 64px;
			}
			#stamp,
			#count {
				position: absolute;
				left: 40px;
				top: 128px;
				display: flex;
			}
			#count {
				top: 152px;
			}
			#stamp i,
			#count i {
				width: 16px;
				height: 16px;
				background: #000;
			}
			#stamp i.on,
			#count i.on {
				background: #fff;
			}
			/* #entry: 64 places of 16 px, the marker in one of them during a show. */
			#track {
				position: absolute;
				left: 40px;
				top: 176px;
				width: 1024px;
				height: 16px;
				background: #000;
				display: none;
			}
			#marker {
				width: 16px;
				height: 16px;
				background: #fff;
				opacity: 0;
			}
			body.entry #track {
				display: block;
			}
			body.entry .third {
				animation: none;
				visibility: hidden;
			}
			body.entry.showing .third {
				visibility: visible;
			}
			.wash {
				position: absolute;
				left: 0;
				right: 0;
				top: 200px;
				bottom: 0;
				background: linear-gradient(
					120deg,
					rgba(255, 0, 80, 0.4),
					rgba(0, 120, 255, 0.6),
					rgba(0, 255, 120, 0.4)
				);
				background-size: 300% 300%;
				animation: wash 4s linear infinite alternate;
			}
			@keyframes wash {
				to {
					background-position: 100% 100%;
				}
			}
			.third {
				position: absolute;
				left: 120px;
				bottom: 110px;
				width: 900px;
				height: 150px;
				box-sizing: border-box;
				padding: 24px 36px;
				border-radius: 12px;
				color: #fff;
				background: linear-gradient(
					90deg,
					rgba(20, 40, 120, 0.92),
					rgba(60, 20, 120, 0.75)
				);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
				animation: slide 3s ease-in-out infinite alternate;
			}
			.third h1 {
				margin: 0;
				font-size: 52px;
			}
			.third p {
				margin: 6px 0 0;
				font-size: 30px;
				opacity: 0.85;
			}
			@keyframes slide {
				from {
					transform: translateX(-1100px);
				}
				to {
					transform: translateX(0);
				}
			}
			body.still .third {
				animation: none;
			}
			body:not(.moving) .wash {
				display: none;
			}
			.title {
				position: absolute;
				border: 0;
				background: transparent;
			}
		</style>
	</head>
	<body>
		<div class="wash"></div>
		<div class="third">
			<h1>Ivan Petrov</h1>
			<p>Chief engineer, notGT broadcast</p>
		</div>
		<div id="stamp"></div>
		<div id="count"></div>
		<div id="track"><div id="marker"></div></div>
		<script>
			// The same list is in scripts/bench.mjs: straight RGBA.
			const PATCHES = [
				[255, 0, 0, 255],
				[0, 255, 0, 255],
				[0, 0, 255, 255],
				[255, 255, 255, 255],
				[128, 128, 128, 255],
				[32, 32, 32, 255],
				[255, 128, 0, 255],
				[255, 255, 255, 128],
				[255, 0, 0, 64],
				[0, 0, 255, 191],
				[0, 0, 0, 128],
			];
			PATCHES.forEach(([r, g, b, a], i) => {
				const div = document.createElement("div");
				div.className = "patch";
				div.style.left = `${40 + i * 96}px`;
				div.style.background = `rgba(${r}, ${g}, ${b}, ${a / 255})`;
				document.body.append(div);
			});
			const mode = location.hash.slice(1) || "lower";
			if (mode === "still") document.body.classList.add("still");
			if (mode === "full" || mode === "heavy") document.body.classList.add("moving");
			if (mode === "heavy") heavyTitles();
			const blocks = (id) => {
				const row = document.getElementById(id);
				return Array.from({ length: 32 }, () => row.appendChild(document.createElement("i")));
			};
			const bits = blocks("stamp");
			const countBits = blocks("count");
			/** `word` in 32 blocks, its highest bit first. */
			function write(row, word) {
				for (let i = 0; i < 32; i++)
					row[i].className = Math.floor(word / 2 ** (31 - i)) % 2 ? "on" : "";
			}
			/** The page's own frames, counted round to 256. */
			let drawn = 0;
			/** The time stamp and the count, for a frame of the page: frame `frame` of show `entry`. */
			function show(entry = 0, frame = 0) {
				const t = Date.now() % 2 ** 24;
				const sum = ((t & 255) + ((t >> 8) & 255) + ((t >> 16) & 255)) & 255;
				write(bits, t * 256 + sum);
				drawn = (drawn + 1) % 256;
				const check = (entry + frame + drawn) & 255;
				write(countBits, ((entry * 256 + frame) * 256 + drawn) * 256 + check);
			}
			/** Five code titles, each in a sandboxed iframe, as notGT puts them. */
			function heavyTitles() {
				const page = (style, body, script) =>
					`<!doctype html><html><head><style>html,body{margin:0;overflow:hidden;background:transparent;font-family:"DejaVu Sans",sans-serif;color:#fff}${style}</style></head><body>${body}<script>${script}<\/script></body></html>`;
				const titles = [
					// Kinetic text: letters rising one after another, and a ticker.
					[{ left: 1000, top: 210, width: 880, height: 260 }, page(
						".l{display:inline-block;font-size:64px;font-weight:700}.t{position:absolute;bottom:10px;white-space:nowrap;font-size:28px}",
						'<div id="w"></div><div class="t" id="t"></div>',
						`const w=document.getElementById("w"),t=document.getElementById("t");
						 [..."NOTGT HEAVY CODE TITLE • KINETIC LETTERS • 60 FPS"].forEach((c,i)=>{const s=document.createElement("span");s.className="l";s.textContent=c===" "?"\u00a0":c;w.append(s);
						 s.animate([{transform:"translateY(80px) rotate(-20deg)",opacity:0},{transform:"none",opacity:1}],{duration:900,delay:i*40,iterations:Infinity,direction:"alternate",easing:"cubic-bezier(.2,.8,.2,1)"})});
						 for(let i=0;i<160;i++){const s=document.createElement("span");s.textContent=" BREAKING · "+i+" ";t.append(s)}
						 t.animate([{transform:"translateX(0)"},{transform:"translateX(-4000px)"}],{duration:20000,iterations:Infinity});`)],
					// Canvas: 3000 particles with trails and additive light.
					[{ left: 1000, top: 500, width: 880, height: 360 }, page(
						"canvas{display:block}", '<canvas id="c" width="880" height="360"></canvas>',
						`const c=document.getElementById("c"),x=c.getContext("2d"),P=[];
						 for(let i=0;i<3000;i++)P.push({x:Math.random()*880,y:Math.random()*360,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,h:Math.random()*360});
						 (function f(){x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.18)";x.fillRect(0,0,880,360);x.globalCompositeOperation="lighter";
						 for(const p of P){p.x=(p.x+p.vx+880)%880;p.y=(p.y+p.vy+360)%360;x.fillStyle="hsla("+p.h+",90%,60%,.6)";x.fillRect(p.x,p.y,3,3)}requestAnimationFrame(f)})();`)],
					// SVG: 80 shapes moved by script every frame, under a blur filter.
					[{ left: 40, top: 220, width: 900, height: 300 }, page(
						"svg{display:block}", '<svg id="s" width="900" height="300"><defs><filter id="b"><feGaussianBlur stdDeviation="3"/></filter></defs><g id="g" filter="url(#b)"></g></svg>',
						`const g=document.getElementById("g"),N=[];
						 for(let i=0;i<80;i++){const e=document.createElementNS("http://www.w3.org/2000/svg","circle");e.setAttribute("r",6+i%14);e.setAttribute("fill","hsl("+i*4.5+",80%,60%)");e.setAttribute("opacity",".7");g.append(e);N.push(e)}
						 (function f(t){N.forEach((e,i)=>{e.setAttribute("cx",450+Math.sin(t/700+i)*400);e.setAttribute("cy",150+Math.cos(t/500+i*1.7)*120)});requestAnimationFrame(f)})(0);`)],
					// CSS: clip-path, masks and a backdrop blur, all moving.
					[{ left: 40, top: 560, width: 900, height: 200 }, page(
						".a{position:absolute;inset:0;background:linear-gradient(90deg,#ff2d6f,#ffb800,#00d0ff);animation:c 2s linear infinite alternate;-webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}.b{position:absolute;left:100px;top:40px;width:700px;height:120px;backdrop-filter:blur(12px);background:rgba(0,0,0,.3);border-radius:16px;font-size:56px;line-height:120px;text-align:center;animation:d 3s ease-in-out infinite alternate}@keyframes c{from{clip-path:polygon(0 0,40% 0,30% 100%,0 100%)}to{clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}}@keyframes d{from{transform:translateX(-80px) scale(.9)}to{transform:translateX(80px) scale(1.05)}}",
						'<div class="a"></div><div class="b">CLIP · MASK · BLUR</div>', "")],
					// Scoreboard: 300 cells of text rewritten every frame.
					[{ left: 40, top: 790, width: 900, height: 260 }, page(
						"#b{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;font:16px monospace}#b div{background:rgba(20,30,80,.8);padding:4px;text-align:center}",
						'<div id="b"></div>',
						`const b=document.getElementById("b"),C=[];for(let i=0;i<300;i++){const d=document.createElement("div");b.append(d);C.push(d)}
						 (function f(t){for(let i=0;i<300;i++)C[i].textContent=((t/10+i*37)|0)%1000;requestAnimationFrame(f)})(0);`)],
				];
				for (const [box, html] of titles) {
					const frame = document.createElement("iframe");
					frame.className = "title";
					frame.setAttribute("sandbox", "allow-scripts");
					Object.assign(frame.style, {
						left: `${box.left}px`,
						top: `${box.top}px`,
						width: `${box.width}px`,
						height: `${box.height}px`,
					});
					frame.srcdoc = html;
					document.body.append(frame);
				}
			}
			/** #entry: a show every `period` ms, the page still between them. */
			function entries() {
				const params = new URLSearchParams(location.search);
				const frameMs = 1000 / (Number(params.get("fps")) || 60);
				const period = Number(params.get("period")) || 2500;
				// The same number is in scripts/bench.mjs.
				const FRAMES = 60;
				const marker = document.getElementById("marker");
				const third = document.querySelector(".third");
				document.body.classList.add("entry");
				let entry = 0;
				setInterval(() => {
					entry = (entry % 255) + 1;
					let frame = 0;
					requestAnimationFrame(function tick() {
						if (frame === 0) {
							document.body.classList.add("showing");
							// The marker's place is the show's frame by the clock;
							// starting half a frame in keeps a frame drawn a little
							// early or late in its own place.
							marker.animate(
								[
									{ opacity: 1, transform: "translateX(0)" },
									{ opacity: 1, transform: `translateX(${FRAMES * 16}px)` },
								],
								{ duration: FRAMES * frameMs, delay: -frameMs / 2, easing: `steps(${FRAMES})` },
							);
							third.animate(
								[{ transform: "translateX(-1100px)" }, { transform: "translateX(0)" }],
								{ duration: FRAMES * frameMs, easing: "cubic-bezier(.2,.8,.2,1)" },
							);
						}
						if (frame < FRAMES) {
							show(entry, frame++);
							requestAnimationFrame(tick);
						} else {
							// Over: still until the next one.
							document.body.classList.remove("showing");
							show();
						}
					});
				}, period);
			}
			show();
			if (mode === "entry") entries();
			else if (mode !== "still")
				requestAnimationFrame(function tick() {
					show();
					requestAnimationFrame(tick);
				});
		</script>
	</body>
</html>
